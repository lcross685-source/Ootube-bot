# Content verticals, ordered by revenue density.
#
# rpm_usd = USD revenue per 1000 monetized playbacks. These are planning
# estimates for a US-majority audience; the pipeline overwrites them with your
# real numbers once `ootube calibrate` has YouTube Analytics history to read.
#
# Niche choice is the single largest revenue lever here. A finance video and a
# gaming video with identical view counts differ by roughly an order of
# magnitude in payout, so the scorer weights RPM directly.
#
# `sensitive: true` marks verticals where YouTube's inauthentic-content policy
# specifically calls out AI personas discussing the subject matter (health,
# finance). Those videos are routed through human approval and carry an
# explicit not-advice disclaimer rather than being fully hands-off.

