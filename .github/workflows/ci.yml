name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # The render tests exercise real ffmpeg rather than mocking it.
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,media]"

      - name: Test
        run: pytest -q

      - name: Config sanity
        run: |
          python -c "
          from ootube.config import load_config
          c = load_config()
          assert c.channel.niches, 'no niches configured'
          assert c.freshness.max_event_age_days > 0
          print(f'{len(c.channel.niches)} niches, freshness window {c.freshness.max_event_age_days}d')
          "
