name: draft

# Drafts edit packages and uploads them as build artifacts. It never publishes:
# publishing happens after a human has cut the video.
#
# Running this in CI is optional. The natural home for an editing workflow is
# your own machine, where the footage lands straight in your Premiere scratch
# folder. CI is for keeping drafts flowing while you are away from it.
on:
  schedule:
    - cron: "0 12 * * *"   # 08:00 America/New_York (EDT)
  workflow_dispatch:
    inputs:
      limit:
        description: "Max packages to draft"
        required: false
        default: ""

concurrency:
  group: ootube-draft
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Restore bot state
        run: |
          git config user.name "ootube-bot"
          git config user.email "ootube-bot@users.noreply.github.com"
          mkdir -p data
          if git ls-remote --exit-code --heads origin bot-state >/dev/null 2>&1; then
            git fetch origin bot-state --depth=1
            git show origin/bot-state:ootube.db > data/ootube.db 2>/dev/null \
              || echo "no state file yet; starting fresh"
          else
            echo "no bot-state branch yet; starting fresh"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install ootube
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[script,media]" edge-tts

      - name: Draft
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.limit }}" ]; then ARGS="--limit ${{ inputs.limit }}"; fi
          ootube run $ARGS --json | tee run-report.json

      - name: Save bot state
        if: always()
        run: |
          if [ ! -f data/ootube.db ]; then exit 0; fi
          TMP=$(mktemp -d)
          cp data/ootube.db "$TMP/ootube.db"
          git checkout --orphan bot-state-tmp
          git rm -rf --cached . >/dev/null 2>&1 || true
          find . -maxdepth 1 -not -name .git -not -name . -exec rm -rf {} + 2>/dev/null || true
          cp "$TMP/ootube.db" ootube.db
          git add ootube.db
          git commit -m "state: $(date -u +%Y-%m-%dT%H:%M:%SZ)" || exit 0
          git push -f origin bot-state-tmp:bot-state

      # The whole package, so it can be opened in an NLE after download.
      # B-roll makes these large; keep retention short.
      - name: Upload edit packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edit-packages-${{ github.run_id }}
          path: |
            out/**
            run-report.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Report failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "ootube: draft run failing";
            const body = `Run [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) failed at ${new Date().toISOString()}.`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "ootube-failure",
            });
            if (existing.data.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ["ootube-failure"],
              });
            }
